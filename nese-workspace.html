<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Neşe's Workspace</title><style>body{margin:0;background:#030711;color:#f7f9ff;font-family:system-ui,sans-serif}main{max-width:900px;margin:10vh auto;padding:32px}button,input,textarea{font:inherit}button{cursor:pointer}input,textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0 14px;padding:12px;background:#071122;border:1px solid #1b2b48;color:white;border-radius:10px}.primary{padding:12px 18px;background:white;color:#07101d;border:0;border-radius:10px;font-weight:700}.card{padding:24px;border:1px solid #1b2b48;border-radius:16px;background:#091426}.hidden{display:none}</style></head><body><main><div id="login" class="card"><h1>🧠 Neşe's Workspace</h1><p>Your personal study, research & STEM command center.</p><label>Name</label><input id="loginName" placeholder="Neşe"><label>Workspace subtitle</label><input id="loginSubtitle" placeholder="Neuroscience • Medicine • STEM"><button class="primary" id="enterBtn">Enter Workspace</button></div><div id="workspace" class="hidden"><div class="card"><h1>Welcome, <span id="helloName"></span>.</h1><p id="helloSubtitle"></p><button class="primary" id="editBtn">Edit profile</button></div><div id="profile" class="card hidden" style="margin-top:16px"><label>Name</label><input id="profileName"><label>Subtitle</label><input id="profileSubtitle"><label>About</label><textarea id="profileAbout"></textarea><button class="primary" id="saveBtn">Save profile</button></div></div></main><script>const KEY='nese_workspace_profile';let p=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'Neşe',subtitle:'Neuroscience • Medicine • STEM',about:''};const $=id=>document.getElementById(id);function render(){$('helloName').textContent=p.name;$('helloSubtitle').textContent=p.subtitle;$('profileName').value=p.name;$('profileSubtitle').value=p.subtitle;$('profileAbout').value=p.about}$('enterBtn').onclick=()=>{p.name=$('loginName').value.trim()||'Neşe';p.subtitle=$('loginSubtitle').value.trim()||'My workspace';localStorage.setItem(KEY,JSON.stringify(p));$('login').classList.add('hidden');$('workspace').classList.remove('hidden');render()};$('editBtn').onclick=()=>{$('profile').classList.toggle('hidden');render()};$('saveBtn').onclick=()=>{p.name=$('profileName').value.trim()||'Neşe';p.subtitle=$('profileSubtitle').value.trim()||'My workspace';p.about=$('profileAbout').value;localStorage.setItem(KEY,JSON.stringify(p));render();$('profile').classList.add('hidden')};</script></body></html>
